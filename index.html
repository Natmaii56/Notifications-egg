<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farm Monitor - ระบบติดตามตัวละคร</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>⚡ FARM MONITOR</h1>
      <p>พิมพ์ชื่อตัวละครเพื่อดูรายการแจ้งเตือน</p>
    </header>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 พิมพ์ชื่อตัวละครเพื่อค้นหา..." oninput="filterData()">
    </div>

    <div id="characterList">
      <!-- จะซ่อนไว้ก่อน จนกว่าจะพิมพ์ค้นหา -->
    </div>
  </div>

  <script>
    let allData = [];

    // ดึงข้อมูลจาก data.json
    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + new Date().getTime());
        allData = await res.json();
      } catch (err) {
        console.error("โหลดข้อมูลไม่ได้:", err);
      }
    }

    // แสดงผล UI
    function renderData(data) {
      const container = document.getElementById('characterList');
      container.innerHTML = '';

      if (data.length === 0) {
        container.innerHTML = `<div class="no-result">❌ ไม่พบข้อมูลแจ้งเตือนของตัวละครนี้</div>`;
        return;
      }

      data.forEach(char => {
        const logsHTML = char.notifications.map(n => `
          <div class="log-item">
            <span class="log-time">${n.time}</span>
            <div class="log-msg ${n.type}">${n.message}</div>
          </div>
        `).join('');

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="char-header">
            <div class="char-name">👤 ${char.name}</div>
          </div>
          <div class="logs-title">🔔 รายการแจ้งเตือน</div>
          <div class="log-list">${logsHTML}</div>
        `;
        container.appendChild(card);
      });
    }

    // ค้นหาตัวละคร (ต้องพิมพ์ก่อนถึงจะโชว์)
    function filterData() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('characterList');

      // ถ้าช่องค้นหาว่างเปล่า ให้ล้างหน้าจอออกทันที ไม่โชว์อะไรเลย
      if (keyword === '') {
        container.innerHTML = '';
        return;
      }

      const filtered = allData.filter(item => item.name.toLowerCase().includes(keyword));
      renderData(filtered);
    }

    // โหลดข้อมูลมารอไว้ในระบบ
    loadData();
  </script>
</body>
</html>
